<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>飲食店注文システム</title>

<style>
body {
  font-family: sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 12px;
}

h1 {
  text-align: center;
  font-size: 24px;
}

nav {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

nav button {
  flex: 1;
  background: #555;
}

section {
  background: white;
  padding: 14px;
  margin-bottom: 14px;
  border-radius: 10px;
}

input, select, textarea, button {
  font-size: 16px;
  padding: 8px;
  margin-top: 6px;
  box-sizing: border-box;
}

input, select, textarea {
  width: 100%;
}

button {
  border: none;
  border-radius: 6px;
  background: #333;
  color: white;
}

.danger {
  background: #c0392b;
}

.orange {
  background: #d35400;
}

.menu-item, .cart-item {
  border-bottom: 1px solid #ddd;
  padding: 10px 0;
}

.menu-name {
  font-weight: bold;
  font-size: 18px;
}

.small-button {
  padding: 5px 8px;
  margin-right: 4px;
}

.empty {
  color: #777;
  text-align: center;
}
</style>
</head>

<body>

<h1>飲食店注文システム</h1>

<nav>
  <button onclick="showTab('menuTab')">メニュー管理</button>
  <button onclick="showTab('orderTab')">スタッフ注文</button>
</nav>

<div id="menuTab">

  <section>
    <h2>メニュー追加</h2>

    <input type="text" id="menuName" placeholder="メニュー名">
    <input type="number" id="menuPrice" placeholder="金額">

    <button onclick="addMenu()">追加</button>
  </section>

  <section>
    <h2>登録済みメニュー</h2>
    <div id="menuManageList"></div>
  </section>

</div>

<div id="orderTab" style="display:none;">

  <section>
    <h2>席番号</h2>
    <select id="tableNumber">
      <option value="">席を選択してください</option>
    </select>
  </section>

  <section>
    <h2>メニュー</h2>
    <div id="orderMenuList"></div>
  </section>

  <section>
    <h2>注文内容</h2>
    <div id="cartList"></div>
    <p>合計：<span id="totalPrice">0</span>円</p>
    <button class="orange" onclick="submitOrder()">注文送信</button>
  </section>

</div>

<script>
const MENU_KEY = "orderSystemMenus";
const ORDER_KEY = "orderSystemOrders";

const TABLES = [
  "1", "2", "3", "4", "5", "6", "7", "8",
  "10", "11", "12",
  "13A", "13B", "13C",
  "14", "15", "16", "17", "18",
  "VIP"
];

let menus = [];
let cart = [];

function showTab(tabId) {
  document.getElementById("menuTab").style.display = "none";
  document.getElementById("orderTab").style.display = "none";

  document.getElementById(tabId).style.display = "block";

  loadMenus();
  renderCart();
}

function createTableOptions() {
  const select = document.getElementById("tableNumber");

  TABLES.forEach(table => {
    const option = document.createElement("option");
    option.value = table;
    option.textContent = table + "席";
    select.appendChild(option);
  });
}

function loadMenus() {
  menus = JSON.parse(localStorage.getItem(MENU_KEY) || "[]");

  renderMenuManageList();
  renderOrderMenuList();
}

function saveMenus() {
  localStorage.setItem(MENU_KEY, JSON.stringify(menus));
}

function addMenu() {
  const name = document.getElementById("menuName").value.trim();
  const price = document.getElementById("menuPrice").value;

  if (!name) {
    alert("メニュー名を入力してください。");
    return;
  }

  if (!price) {
    alert("金額を入力してください。");
    return;
  }

  menus.push({
    name: name,
    price: Number(price)
  });

  saveMenus();

  document.getElementById("menuName").value = "";
  document.getElementById("menuPrice").value = "";

  loadMenus();
}

function renderMenuManageList() {
  const list = document.getElementById("menuManageList");
  list.innerHTML = "";

  if (menus.length === 0) {
    list.innerHTML = '<p class="empty">メニューがありません。</p>';
    return;
  }

  menus.forEach((menu, index) => {
    const div = document.createElement("div");
    div.className = "menu-item";

    div.innerHTML = `
      <div class="menu-name">${menu.name}</div>
      <div>${menu.price}円</div>
      <button class="small-button danger" onclick="deleteMenu(${index})">削除</button>
    `;

    list.appendChild(div);
  });
}

function deleteMenu(index) {
  if (!confirm("このメニューを削除しますか？")) {
    return;
  }

  menus.splice(index, 1);
  saveMenus();
  loadMenus();
}

function renderOrderMenuList() {
  const list = document.getElementById("orderMenuList");
  list.innerHTML = "";

  if (menus.length === 0) {
    list.innerHTML = '<p class="empty">メニューが登録されていません。</p>';
    return;
  }

  menus.forEach((menu, index) => {
    const div = document.createElement("div");
    div.className = "menu-item";

    div.innerHTML = `
      <div class="menu-name">${menu.name}</div>
      <div>${menu.price}円</div>
      <button onclick="addToCart(${index})">追加</button>
    `;

    list.appendChild(div);
  });
}

function addToCart(index) {
  const menu = menus[index];

  const existingItem = cart.find(item => item.name === menu.name);

  if (existingItem) {
    existingItem.quantity++;
  } else {
    cart.push({
      name: menu.name,
      price: Number(menu.price),
      quantity: 1
    });
  }

  renderCart();
}

function renderCart() {
  const cartList = document.getElementById("cartList");
  const totalPrice = document.getElementById("totalPrice");

  cartList.innerHTML = "";

  if (cart.length === 0) {
    cartList.innerHTML = '<p class="empty">まだ注文がありません。</p>';
    totalPrice.textContent = "0";
    return;
  }

  let total = 0;

  cart.forEach((item, index) => {
    total += item.price * item.quantity;

    const div = document.createElement("div");
    div.className = "cart-item";

    div.innerHTML = `
      <strong>${item.name}</strong><br>
      ${item.price}円 × ${item.quantity}個
      ＝ ${item.price * item.quantity}円<br>

      <button class="small-button" onclick="decreaseItem(${index})">−</button>
      <button class="small-button" onclick="increaseItem(${index})">＋</button>
      <button class="small-button danger" onclick="removeItem(${index})">削除</button>
    `;

    cartList.appendChild(div);
  });

  totalPrice.textContent = total;
}

function increaseItem(index) {
  cart[index].quantity++;
  renderCart();
}

function decreaseItem(index) {
  cart[index].quantity--;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  renderCart();
}

function submitOrder() {
  const tableNumber = document.getElementById("tableNumber").value;

  if (!tableNumber) {
    alert("席番号を選択してください。");
    return;
  }

  if (cart.length === 0) {
    alert("注文内容がありません。");
    return;
  }

  const orders = JSON.parse(localStorage.getItem(ORDER_KEY) || "[]");

  const order = {
    id: Date.now(),
    table: tableNumber,
    items: cart,
    status: "未対応",
    paid: false,
    createdAt: new Date().toLocaleString()
  };

  orders.push(order);
  localStorage.setItem(ORDER_KEY, JSON.stringify(orders));

  alert(tableNumber + "席の注文を送信しました。");

  cart = [];
  renderCart();
}

createTableOptions();
loadMenus();
renderCart();
</script>

</body>
</html>
