<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>order-system</title>
</head>
<body>

    <h1>メニュー管理</h1>

    <section>
        <h2>基本情報</h2>

        <label>メニュー名</label>
        <br>
        <input id="menuName" type="text" placeholder="例：ガンバずし定食">
        <br><br>

        <label>価格</label>
        <br>
        <input id="menuPrice" type="number" placeholder="例：1500">
        <br>

        <label>
            <input id="isMarketPrice" type="checkbox">
            時価
        </label>

        <br><br>

        <label>カテゴリ</label>
        <br>
        <select id="menuCategory" onchange="applyCategoryTemplate()">
            <option value="定食">定食</option>
            <option value="丼・麺">丼・麺</option>
            <option value="一品料理">一品料理</option>
            <option value="活魚">活魚</option>
            <option value="焼鳥">焼鳥</option>
            <option value="刺身">刺身</option>
            <option value="焼魚">焼魚</option>
            <option value="ご飯">ご飯</option>
            <option value="サラダ">サラダ</option>
            <option value="デザート">デザート</option>
            <option value="飲み物">飲み物</option>
            <option value="その他">その他</option>
        </select>

        <br><br>

        <label>説明文</label>
        <br>
        <textarea id="menuDescription" placeholder="セット内容・注意書きなど"></textarea>
    </section>

    <section>
        <h2>タグ</h2>

        <label>
            <input id="isRecommended" type="checkbox">
            おすすめ
        </label>

        <br>

        <label>
            <input id="isShimabara" type="checkbox">
            島原名物
        </label>
    </section>

    <section>
        <h2>表示設定</h2>

        <label>
            <input id="isVisible" type="checkbox" checked>
            お客さんに表示する
        </label>

        <br>

        <label>
            <input id="showNormal" type="checkbox" checked>
            通常営業で表示
        </label>

        <br>

        <label>
            <input id="showBusy" type="checkbox" checked>
            忙しい日も表示
        </label>
    </section>

    <section>
        <h2>写真設定（準備中）</h2>

        <input id="menuImage" type="text" placeholder="写真URL（今は空欄でOK）">
    </section>

    <br>

    <button id="saveButton" onclick="saveMenu()">追加</button>

    <h2>メニュー一覧</h2>

    <input id="searchText" type="text" placeholder="メニュー検索" oninput="showMenus()">

    <div id="menuList"></div>

    <script>
        let menus = [];
        let editIndex = null;

        const categories = [
            "定食",
            "丼・麺",
            "一品料理",
            "活魚",
            "焼鳥",
            "刺身",
            "焼魚",
            "ご飯",
            "サラダ",
            "デザート",
            "飲み物",
            "その他"
        ];

        function saveMenu() {
            const name = document.getElementById("menuName").value;
            const price = document.getElementById("menuPrice").value;
            const category = document.getElementById("menuCategory").value;
            const description = document.getElementById("menuDescription").value;
            const isRecommended = document.getElementById("isRecommended").checked;
            const isShimabara = document.getElementById("isShimabara").checked;
            const isVisible = document.getElementById("isVisible").checked;
            const showNormal = document.getElementById("showNormal").checked;
            const showBusy = document.getElementById("showBusy").checked;
            const isMarketPrice = document.getElementById("isMarketPrice").checked;
            const image = document.getElementById("menuImage").value;

            if (name === "") {
                alert("メニュー名を入力してください");
                return;
            }

            if (!isMarketPrice && price === "") {
                alert("価格を入力するか、時価にチェックを入れてください");
                return;
            }

            const menu = {
                name: name,
                price: price,
                category: category,
                description: description,
                isRecommended: isRecommended,
                isShimabara: isShimabara,
                isVisible: isVisible,
                showNormal: showNormal,
                showBusy: showBusy,
                isMarketPrice: isMarketPrice,
                image: image
            };

            if (editIndex === null) {
                menus.push(menu);
            } else {
                menus[editIndex] = menu;
                editIndex = null;
                document.getElementById("saveButton").textContent = "追加";
            }

            saveMenus();
            showMenus();
            clearForm();
        }

        function showMenus() {
            const menuList = document.getElementById("menuList");
            const searchText = document.getElementById("searchText").value;
            menuList.innerHTML = "";

            categories.forEach(function(category) {
                const categoryMenus = menus
                    .map(function(menu, index) {
                        return { menu: menu, index: index };
                    })
                    .filter(function(item) {
                        const menu = item.menu;
                        const tags = getTagsText(menu);
                        const visibleText = menu.isVisible === false ? "非表示" : "表示中";
                        const normalText = menu.showNormal === false ? "通常なし" : "通常";
                        const busyText = menu.showBusy === false ? "忙しい日なし" : "忙しい日";
                        const priceText = getPriceText(menu);

                        const isSameCategory = menu.category === category;
                        const isSearchMatch =
                            menu.name.includes(searchText) ||
                            (menu.description || "").includes(searchText) ||
                            menu.category.includes(searchText) ||
                            tags.includes(searchText) ||
                            visibleText.includes(searchText) ||
                            normalText.includes(searchText) ||
                            busyText.includes(searchText) ||
                            priceText.includes(searchText);

                        return isSameCategory && isSearchMatch;
                    });

                if (categoryMenus.length === 0) {
                    return;
                }

                const details = document.createElement("details");
                details.open = searchText !== "";

                const summary = document.createElement("summary");
                summary.textContent = category + "（" + categoryMenus.length + "件）";
                details.appendChild(summary);

                const ul = document.createElement("ul");

                categoryMenus.forEach(function(item) {
                    const menu = item.menu;
                    const index = item.index;
                    const tags = getTagsText(menu);
                    const visibleText = menu.isVisible === false ? "非表示" : "表示中";
                    const normalText = menu.showNormal === false ? "通常なし" : "通常";
                    const busyText = menu.showBusy === false ? "忙しい日なし" : "忙しい日";

                    const li = document.createElement("li");

                    li.innerHTML = `
                        <strong>${menu.name}</strong>：${getPriceText(menu)}
                        <br>
                        状態：${visibleText} / ${normalText} / ${busyText}
                        <br>
                        ${tags ? "タグ：" + tags + "<br>" : ""}
                        ${menu.description ? "説明：" + menu.description + "<br>" : ""}
                        ${menu.image ? "写真：" + menu.image + "<br>" : ""}
                        <button onclick="editMenu(${index})">編集</button>
                        <button onclick="deleteMenu(${index})">削除</button>
                    `;

                    ul.appendChild(li);
                });

                details.appendChild(ul);
                menuList.appendChild(details);
            });
        }

        function applyCategoryTemplate() {
            const category = document.getElementById("menuCategory").value;
            const description = document.getElementById("menuDescription");

            if (category === "活魚" && description.value === "") {
                description.value = "水槽からお選びください。価格は大きさ・状態によって異なります。";
                document.getElementById("isMarketPrice").checked = true;
            }
        }

        function getPriceText(menu) {
            if (menu.isMarketPrice) {
                return "時価";
            }

            return menu.price + "円";
        }

        function getTagsText(menu) {
            let tags = [];

            if (menu.isRecommended) {
                tags.push("おすすめ");
            }

            if (menu.isShimabara) {
                tags.push("島原名物");
            }

            return tags.join("・");
        }

        function editMenu(index) {
            const menu = menus[index];

            document.getElementById("menuName").value = menu.name;
            document.getElementById("menuPrice").value = menu.price || "";
            document.getElementById("menuCategory").value = menu.category;
            document.getElementById("menuDescription").value = menu.description || "";
            document.getElementById("isRecommended").checked = menu.isRecommended || false;
            document.getElementById("isShimabara").checked = menu.isShimabara || false;
            document.getElementById("isVisible").checked = menu.isVisible !== false;
            document.getElementById("showNormal").checked = menu.showNormal !== false;
            document.getElementById("showBusy").checked = menu.showBusy !== false;
            document.getElementById("isMarketPrice").checked = menu.isMarketPrice || false;
            document.getElementById("menuImage").value = menu.image || "";

            editIndex = index;
            document.getElementById("saveButton").textContent = "更新";
        }

        function deleteMenu(index) {
            menus.splice(index, 1);
            saveMenus();
            showMenus();
        }

        function clearForm() {
            document.getElementById("menuName").value = "";
            document.getElementById("menuPrice").value = "";
            document.getElementById("menuDescription").value = "";
            document.getElementById("menuImage").value = "";
            document.getElementById("isRecommended").checked = false;
            document.getElementById("isShimabara").checked = false;
            document.getElementById("isVisible").checked = true;
            document.getElementById("showNormal").checked = true;
            document.getElementById("showBusy").checked = true;
            document.getElementById("isMarketPrice").checked = false;
        }

        function saveMenus() {
            localStorage.setItem("orderSystemMenus", JSON.stringify(menus));
        }

        function loadMenus() {
            const savedMenus = localStorage.getItem("orderSystemMenus");

            if (savedMenus) {
                menus = JSON.parse(savedMenus);
            }

            showMenus();
        }

        loadMenus();
    </script>

</body>
</html>
